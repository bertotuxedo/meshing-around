name: meshing-around

services:
  meshing-around:
    build:
      context: .
    image: bertotuxedo/meshing-around:local
    container_name: meshing-around
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TZ: ${TZ:-America/New_York}
      MESHING_AROUND_CONFIG: /config/config.yaml
      MESHTASTIC_HOST: ${MESHTASTIC_HOST:-192.168.1.95}
      MESHTASTIC_PORT: ${MESHTASTIC_PORT:-4403}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Any INI setting can be overridden with this pattern:
      # MESHING_AROUND__GENERAL__RESPOND_BY_DM_ONLY: "True"
    volumes:
      - type: bind
        source: ./config.yaml
        target: /config/config.yaml
        read_only: true
      - meshing-data:/var/lib/meshing-around
      - meshing-logs:/var/log/meshing-around
    tmpfs:
      - /run/meshing-around:uid=10001,gid=10001,mode=0750,size=16m
      - /tmp:uid=10001,gid=10001,mode=1777,size=64m
    ports:
      - "${DASHBOARD_PORT:-8420}:8420"
    extra_hosts:
      - host.docker.internal:host-gateway
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILES:-3}
    healthcheck:
      test: ["CMD", "python", "/app/script/docker/healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - meshing-around
    # For a serial node, change config.yaml to type: serial and uncomment:
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0

networks:
  meshing-around:
    driver: bridge

volumes:
  meshing-data:
  meshing-logs:
