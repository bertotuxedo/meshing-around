name: Validate container deployment

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install adapter dependency
        run: python -m pip install "PyYAML>=6.0,<7.0"

      - name: Run configuration adapter tests
        run: python -m unittest discover -s tests -v

      - name: Render strict example configuration
        run: >-
          python script/docker/render_config.py
          --template config.template
          --source config.yaml
          --output /tmp/meshing-around.ini
          --strict

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build container image
        run: docker build --tag meshing-around:test .
